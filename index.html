<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestión de Facturas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>

<body class="bg-light">
    <div class="container py-4">
        <ul class="nav nav-tabs" id="myTab" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="config-tab" data-bs-toggle="tab" data-bs-target="#config"
                    type="button" role="tab">📄 Configuración API</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="consulta-tab" data-bs-toggle="tab" data-bs-target="#consulta" type="button"
                    role="tab">🚀 Consulta / Envío de Facturas</button>
            </li>
        </ul>

        <div class="tab-content border border-top-0 p-4 bg-white shadow-sm" id="myTabContent">
            <!-- Configuración API -->
            <div class="tab-pane fade show active" id="config" role="tabpanel" aria-labelledby="config-tab">
                <form id="configForm">
                    <div class="mb-3">
                        <label class="form-label">IP Servidor</label>
                        <input type="text" class="form-control" name="ip" required />
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Puerto</label>
                        <input type="number" class="form-control" name="puerto" required />
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" name="email" required />
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Contraseña</label>
                        <input type="password" class="form-control" name="password" required />
                    </div>
                    <div class="mb-3">
                        <label class="form-label">iApp</label>
                        <input type="text" class="form-control" name="iapp" required />
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Plazo</label>
                        <input type="text" class="form-control" name="plazo" required />
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Códigos de Facturas</label><br />
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="checkbox" name="venta" value="v" checked />
                            <label class="form-check-label">Venta (V)</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="checkbox" name="compra" value="c" />
                            <label class="form-check-label">Compra (C)</label>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Moneda</label>
                        <select class="form-select" name="moneda" required>
                            <option value="COP">COP</option>
                            <option value="USD">USD</option>
                            <option value="EUR">EUR</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-success">Guardar configuración</button>
                </form>
            </div>

            <!-- Consulta / Envío de Facturas -->
            <div class="tab-pane fade" id="consulta" role="tabpanel" aria-labelledby="consulta-tab">
                <form id="consultaForm" novalidate>
                    <!-- Radios: modo de consulta -->
                    <div class="mb-3">
                        <label class="form-label d-block">Modo de consulta</label>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="modoConsulta" id="modoFecha"
                                value="fecha" checked />
                            <label class="form-check-label" for="modoFecha">Por fecha</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="modoConsulta" id="modoRango"
                                value="rango" />
                            <label class="form-check-label" for="modoRango">Por rango de fechas</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="modoConsulta" id="modoIds" value="ids" />
                            <label class="form-check-label" for="modoIds">Por IDs de facturas</label>
                        </div>
                    </div>

                    <!-- Sección: por fecha -->
                    <div class="mb-3 consulta-seccion" data-seccion="fecha">
                        <label class="form-label">Fecha específica</label>
                        <input type="date" class="form-control" name="fecha" required />
                        <div class="invalid-feedback">Seleccione una fecha.</div>
                    </div>

                    <!-- Sección: por rango -->
                    <div class="mb-3 consulta-seccion" data-seccion="rango" hidden>
                        <label class="form-label">Rango de fechas</label>
                        <div class="row g-2">
                            <div class="col">
                                <input type="date" class="form-control" name="fecha_desde" required disabled />
                                <div class="invalid-feedback">Fecha inicial requerida.</div>
                            </div>
                            <div class="col">
                                <input type="date" class="form-control" name="fecha_hasta" required disabled />
                                <div class="invalid-feedback">Fecha final requerida.</div>
                            </div>
                        </div>
                        <div class="form-text">La fecha final debe ser igual o posterior a la inicial.</div>
                    </div>

                    <!-- Sección: por IDs -->
                    <div class="mb-3 consulta-seccion" data-seccion="ids" hidden>
                        <label class="form-label">Números de facturas (separados por coma)</label>
                        <input type="text" class="form-control" name="numeros" placeholder="1001,1002,1003"
                            inputmode="numeric" pattern="^\s*\d+\s*(,\s*\d+\s*)*$" required disabled />
                        <div class="form-text">Ejemplo válido: 1001, 1002, 1003</div>
                        <div class="invalid-feedback">Ingrese solo números separados por coma (sin letras ni símbolos).
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary me-2">Consultar</button>
                    <button type="button" class="btn btn-warning" id="btnEnviar">Enviar a API destino</button>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // --- Guardar configuración ---
        document.getElementById("configForm").addEventListener("submit", function (e) {
            e.preventDefault();
            alert("Configuración guardada");
        });

        // --- Helpers de UI para consulta ---
        const consultaForm = document.getElementById("consultaForm");
        const secciones = document.querySelectorAll(".consulta-seccion");
        const radios = document.querySelectorAll('input[name="modoConsulta"]');

        function activarSeccion(modo) {
            secciones.forEach((sec) => {
                const activa = sec.dataset.seccion === modo;
                sec.hidden = !activa;
                // Habilitar/Deshabilitar campos dentro de cada sección
                sec.querySelectorAll("input, select, textarea").forEach((el) => {
                    el.disabled = !activa;
                });
            });
            // Reset de clases de validación de Bootstrap
            consultaForm.classList.remove("was-validated");
            // Limpiar errores personalizados de rango
            const hasta = consultaForm.elements["fecha_hasta"];
            if (hasta) hasta.setCustomValidity("");
        }

        // Cambiar sección al seleccionar radio
        radios.forEach((r) =>
            r.addEventListener("change", (e) => activarSeccion(e.target.value))
        );

        // Estado inicial
        activarSeccion(document.querySelector('input[name="modoConsulta"]:checked').value);

        // Validación y armado de payload
        function construirPayload() {
            const modo = consultaForm.elements["modoConsulta"].value;

            if (!consultaForm.checkValidity()) {
                consultaForm.classList.add("was-validated");
                return null;
            }

            // Validación adicional para rango: hasta >= desde
            if (modo === "rango") {
                const desde = consultaForm.elements["fecha_desde"].value;
                const hasta = consultaForm.elements["fecha_hasta"].value;

                const inputHasta = consultaForm.elements["fecha_hasta"];
                inputHasta.setCustomValidity("");

                if (desde && hasta && new Date(desde) > new Date(hasta)) {
                    inputHasta.setCustomValidity("La fecha final no puede ser menor que la inicial.");
                    inputHasta.reportValidity();
                    return null;
                }
            }

            const payload = { modo, filtros: {} };

            if (modo === "fecha") {
                payload.filtros.fecha = consultaForm.elements["fecha"].value;
            } else if (modo === "rango") {
                payload.filtros.desde = consultaForm.elements["fecha_desde"].value;
                payload.filtros.hasta = consultaForm.elements["fecha_hasta"].value;
            } else if (modo === "ids") {
                const raw = consultaForm.elements["numeros"].value;
                payload.filtros.ids = raw
                    .split(",")
                    .map((s) => s.trim())
                    .filter(Boolean);
            }

            return payload;
        }

        // --- Consultar facturas ---
        consultaForm.addEventListener("submit", function (e) {
            e.preventDefault();
            const payload = construirPayload();
            if (!payload) return;
            alert("Consultando facturas con:\n\n" + JSON.stringify(payload, null, 2));
            // Aquí podrías hacer fetch/axios al endpoint correspondiente
        });

        // --- Enviar facturas ---
        document.getElementById("btnEnviar").addEventListener("click", function () {
            const payload = construirPayload();
            if (!payload) return;
            alert("Enviando facturas al servicio destino con:\n\n" + JSON.stringify(payload, null, 2));
            // Aquí podrías hacer fetch/axios al endpoint de envío
        });
    </script>
</body>

</html>
